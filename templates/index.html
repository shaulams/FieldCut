<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Cut</title>
<meta name="theme-color" content="#0e0e0e">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0e0e;
    --bg2: #161616;
    --bg3: #1e1e1e;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text2: #888;
    --text3: #555;
    --green: #1D9E75;
    --green-dim: rgba(29,158,117,0.12);
    --blue: #378ADD;
    --blue-dim: rgba(55,138,221,0.1);
    --mono: 'JetBrains Mono', 'Fira Mono', monospace;
    --sans: 'Alef', 'Heebo', 'Assistant', system-ui, sans-serif;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f5f5f5;
    --bg2: #ffffff;
    --bg3: #eaeaea;
    --border: #d4d4d4;
    --text: #1a1a1a;
    --text2: #555;
    --text3: #999;
    --green: #168a63;
    --green-dim: rgba(22,138,99,0.1);
    --blue: #2b6cb0;
    --blue-dim: rgba(43,108,176,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; height: 100vh; display: flex; flex-direction: column; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }

  /* TOP BAR */
  .topbar { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
  .logo { font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: 0.15em; color: var(--green); }
  .file-info { font-family: var(--mono); font-size: 13px; color: var(--text2); }
  .topbar-btn { font-family: var(--sans); font-size: 13px; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .topbar-btn:hover { border-color: var(--green); color: var(--green); }
  .topbar-btn:active { transform: scale(0.96); }
  .topbar-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .project-name { font-family: var(--sans); font-size: 14px; color: var(--text); cursor: pointer; padding: 3px 8px; border-radius: 4px; border: 1px solid transparent; transition: border-color 0.15s, color 0.15s; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-name:hover { border-color: var(--border); color: var(--green); }
  .topbar-sep { width: 1px; height: 20px; background: var(--border); }
  .lang-btn { font-family: var(--sans); font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .lang-btn:hover { border-color: var(--green); color: var(--green); }
  .lang-btn:active { transform: scale(0.96); }
  .lang-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .status-pill { font-family: var(--sans); font-size: 13px; padding: 4px 12px; border-radius: 20px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .status-idle { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
  .status-working { background: rgba(55,138,221,0.15); color: var(--blue); border: 1px solid rgba(55,138,221,0.3); }
  .status-done { background: rgba(29,158,117,0.15); color: var(--green); border: 1px solid rgba(29,158,117,0.3); }
  .status-error { background: rgba(200,50,50,0.15); color: #e06060; border: 1px solid rgba(200,50,50,0.3); }

  /* LAYOUT */
  .main { display: grid; grid-template-columns: 1fr 320px; flex: 1; overflow: hidden; }
  .center { display: flex; flex-direction: column; overflow: hidden; }
  .right { border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  [dir="ltr"] .right { border-right: none; border-left: 1px solid var(--border); }

  /* TRANSCRIPT PANES */
  .transcript-pane { overflow-y: auto; padding: 16px 24px; flex: 1; min-height: 0; }
  .narration-pane { overflow-y: auto; padding: 16px 24px; border-top: 2px solid var(--border); flex: 0 0 auto; max-height: 35%; display: none; }
  .narration-pane.active { display: block; flex: 1; min-height: 0; }
  .pane-label { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; text-wrap: balance; }
  .pane-label .label-count { color: var(--text2); }

  /* WORD-LEVEL TRANSCRIPT */
  .paragraph { margin-bottom: 16px; line-height: 1.85; position: relative; font-size: 15px; }
  .para-ts { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-left: 8px; cursor: pointer; user-select: none; font-variant-numeric: tabular-nums; }
  .para-ts:hover { color: var(--text2); }
  .w { cursor: text; color: var(--text); transition: background 0.1s; border-radius: 2px; padding: 1px 0; font-weight: 400; }
  .w:hover { background: rgba(255,255,255,0.04); }
  .w.clip-highlight { background: var(--green-dim); color: var(--text); }
  .w.narr-highlight { background: var(--blue-dim); color: var(--text); }
  .clip-boundary-start { border-right: 2px solid var(--green); padding-right: 2px; }
  .clip-boundary-end { border-left: 2px solid var(--green); padding-left: 2px; }
  .narr-boundary-start { border-right: 2px solid var(--blue); padding-right: 2px; }
  .narr-boundary-end { border-left: 2px solid var(--blue); padding-left: 2px; }
  .clip-label { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 3px; background: rgba(29,158,117,0.25); color: var(--green); margin-right: 4px; vertical-align: middle; user-select: none; font-weight: 500; }
  .narr-label { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 3px; background: rgba(55,138,221,0.25); color: var(--blue); margin-right: 4px; vertical-align: middle; user-select: none; font-weight: 500; }

  /* FLOATING TOOLBAR */
  .sel-toolbar { position: fixed; display: none; background: var(--bg2); border-radius: 8px; padding: 4px; box-shadow: 0 0 0 1px var(--border), 0 2px 4px rgba(0,0,0,0.15), 0 8px 24px rgba(0,0,0,0.3); z-index: 100; gap: 3px; flex-direction: row; }
  .sel-toolbar.visible { display: flex; }
  .sel-btn { padding: 6px 12px; border-radius: 5px; font-family: var(--mono); font-size: 12px; border: none; cursor: pointer; background: transparent; color: var(--text2); transition: background 0.1s, color 0.1s; white-space: nowrap; }
  .sel-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
  .sel-btn:hover { background: var(--bg3); color: var(--text); }
  .sel-btn.sel-play { color: var(--blue); }
  .sel-btn.sel-play:hover { background: rgba(55,138,221,0.1); }
  .sel-btn.sel-mark { color: var(--green); }
  .sel-btn.sel-mark:hover { background: var(--green-dim); }
  .sel-btn.sel-playing { color: var(--blue); animation: pulse-play 1s ease infinite; }
  @keyframes pulse-play { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  /* UPLOAD ZONE */
  .upload-zone { border: 1px dashed var(--border); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
  .upload-zone:hover { border-color: var(--green); }
  .upload-zone p { font-size: 15px; color: var(--text2); }
  .upload-zone small { font-family: var(--sans); font-size: 12px; color: var(--text2); }

  /* ASSEMBLY TIMELINE */
  .asm-sources { display: flex; gap: 16px; margin-bottom: 10px; }
  .asm-source-group { flex: 1; }
  .asm-source-group h4 { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
  .asm-source-items { display: flex; flex-wrap: wrap; gap: 5px; }
  .asm-chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 5px; font-family: var(--mono); font-size: 12px; cursor: grab; user-select: none; white-space: nowrap; }
  .asm-chip:active { opacity: 0.6; }
  .asm-chip.used { opacity: 0.25; }
  .asm-chip.chip-clip { background: rgba(29,158,117,0.15); color: var(--green); border: 1px solid rgba(29,158,117,0.3); }
  .asm-chip.chip-narr { background: rgba(55,138,221,0.15); color: var(--blue); border: 1px solid rgba(55,138,221,0.3); }
  .asm-chip.dragging { opacity: 0.4; }
  .asm-timeline { min-height: 48px; background: var(--bg3); border: 2px dashed var(--border); border-radius: 6px; display: flex; align-items: center; gap: 5px; padding: 8px 10px; flex-wrap: wrap; transition: border-color 0.2s; }
  .asm-timeline.drag-over { border-color: var(--green); background: rgba(29,158,117,0.04); }
  .asm-timeline:empty::after { content: attr(data-empty); font-family: var(--mono); font-size: 12px; color: var(--text3); margin: auto; }
  .asm-tl-item { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 5px; font-family: var(--mono); font-size: 12px; cursor: grab; user-select: none; white-space: nowrap; position: relative; }
  .asm-tl-item.tl-clip { background: rgba(29,158,117,0.2); color: var(--green); }
  .asm-tl-item.tl-narr { background: rgba(55,138,221,0.2); color: var(--blue); }
  .asm-tl-item .asm-x { margin-right: -2px; cursor: pointer; color: inherit; opacity: 0.4; font-size: 14px; position: relative; padding: 4px; }
  .asm-tl-item .asm-x::before { content: ''; position: absolute; inset: -8px; }
  .asm-tl-item .asm-x:hover { opacity: 1; }
  .asm-tl-item.drag-over-left { box-shadow: inset 3px 0 0 var(--text); }
  .asm-tl-item.drag-over-right { box-shadow: inset -3px 0 0 var(--text); }
  .asm-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .asm-actions .btn { width: auto; padding: 8px 18px; }
  .gap-control { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .gap-control label { font-family: var(--sans); font-size: 13px; color: var(--text2); }
  .gap-control .gap-adj { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 5px; background: transparent; color: var(--text2); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s; padding: 0; }
  .gap-control .gap-adj:hover { border-color: var(--green); color: var(--green); }
  .gap-control .gap-adj:active { transform: scale(0.96); }
  .gap-value { font-family: var(--mono); font-size: 13px; color: var(--text); min-width: 36px; text-align: center; font-variant-numeric: tabular-nums; }

  /* RIGHT PANEL */
  .panel { background: var(--bg2); border-radius: 8px; padding: 14px; box-shadow: 0 0 0 1px var(--border), 0 2px 8px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.1); }
  .panel h3 { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 10px; text-wrap: balance; }
  .step-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .step-num { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px; font-weight: 600; flex-shrink: 0; }
  .step-done { background: rgba(29,158,117,0.2); color: var(--green); }
  .step-active { background: rgba(55,138,221,0.2); color: var(--blue); }
  .step-idle { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
  .step-text { font-size: 13px; color: var(--text2); }

  .clip-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .clip-item:last-child { border-bottom: none; }
  .clip-num { font-family: var(--mono); font-size: 12px; color: var(--text3); width: 22px; flex-shrink: 0; font-weight: 500; }
  .clip-name { font-family: var(--mono); font-size: 12px; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip-dur { font-family: var(--mono); font-size: 12px; color: var(--text3); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .clip-x { font-size: 14px; color: var(--text3); cursor: pointer; flex-shrink: 0; position: relative; }
  .clip-x::before { content: ''; position: absolute; inset: -10px; }
  .clip-x:hover { color: #e06060; }
  .clip-text-preview { font-family: var(--sans); font-size: 12px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
  .clip-expand { font-size: 13px; color: var(--text3); cursor: pointer; flex-shrink: 0; padding: 4px; position: relative; line-height: 1; transition: color 0.15s, transform 0.15s; }
  .clip-expand::before { content: ''; position: absolute; inset: -8px; }
  .clip-expand:hover { color: var(--text2); }
  .clip-item.trimming .clip-expand { color: var(--green); transform: rotate(180deg); }
  .clip-trim-row { display: none; padding: 6px 0 4px; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--border); margin-top: 4px; }
  .clip-item.trimming .clip-trim-row { display: flex; }
  .trim-field { display: flex; align-items: center; gap: 4px; flex: 1; }
  .trim-field label { font-family: var(--sans); font-size: 11px; color: var(--text3); min-width: 28px; }
  .trim-adj { width: 22px; height: 22px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text2); cursor: pointer; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s; padding: 0; }
  .trim-adj:hover { border-color: var(--green); color: var(--green); }
  .trim-adj:active { transform: scale(0.96); }
  .trim-val { font-family: var(--mono); font-size: 11px; color: var(--text); min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }

  .btn { width: 100%; padding: 9px 14px; border-radius: 6px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.03em; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; text-align: center; transition: background 0.15s, color 0.15s, border-color 0.15s; font-weight: 500; }
  .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .btn:active { transform: scale(0.96); }
  .btn:hover { background: var(--bg3); color: var(--text); }
  .btn-primary { border-color: rgba(29,158,117,0.5); color: var(--green); }
  .btn-primary:hover { background: var(--green-dim); }
  .btn-download { background: var(--green); border-color: var(--green); color: #fff; font-size: 13px; padding: 12px 14px; }
  .btn-download:hover { background: #178a64; border-color: #178a64; color: #fff; }
  .btn-reassemble { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-family: var(--mono); font-size: 12px; cursor: pointer; padding: 8px 14px; width: 100%; transition: background 0.15s, color 0.15s; }
  .btn-reassemble:hover { background: var(--bg3); color: var(--text); }
  .btn-danger { border-color: rgba(200,50,50,0.3); color: #e06060; }
  .btn-danger:hover { background: rgba(200,50,50,0.08); }

  input[type="file"] { display: none; }
  textarea { background: var(--bg3); border: 1px solid var(--border); border-radius: 5px; color: var(--text); padding: 8px 10px; font-family: var(--sans); font-size: 13px; width: 100%; resize: vertical; min-height: 60px; margin-bottom: 4px; }
  textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 2px var(--green-dim); }

  /* PROGRESS BAR */
  .progress-bar { display: none; margin-top: 6px; }
  .progress-bar.active { display: block; }
  .progress-track { height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.3s ease; }
  .progress-fill.indeterminate { width: 30% !important; animation: indeterminate 1.5s ease-in-out infinite; }
  @keyframes indeterminate { 0% { margin-left: 0%; } 50% { margin-left: 70%; } 100% { margin-left: 0%; } }
  .progress-label { font-family: var(--mono); font-size: 11px; color: var(--text2); margin-top: 4px; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .progress-label .elapsed { color: var(--text3); }

  .hint { font-family: var(--sans); font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* PHASE BAR */
  .phase-bar { display: flex; align-items: center; justify-content: center; gap: 0; padding: 10px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .phase-step { display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 6px; cursor: pointer; transition: opacity 0.2s, background 0.2s; opacity: 0.4; }
  .phase-step:hover { opacity: 0.7; }
  .phase-step.active { opacity: 1; background: var(--bg3); }
  .phase-step.completed { opacity: 0.8; cursor: pointer; }
  .phase-step.completed .phase-num { background: rgba(29,158,117,0.2); color: var(--green); border-color: rgba(29,158,117,0.3); }
  .phase-step.future { pointer-events: none; opacity: 0.25; }
  .phase-num { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 600; background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
  .phase-step.active .phase-num { background: rgba(55,138,221,0.2); color: var(--blue); border-color: rgba(55,138,221,0.3); }
  .phase-label { font-family: var(--sans); font-size: 14px; color: var(--text2); }
  .phase-connector { width: 32px; height: 1px; background: var(--border); }

  /* PHASE SCREENS */
  .phase-screen { display: none; flex: 1; overflow: hidden; }
  .phase-screen.active { display: flex; flex-direction: column; }

  /* PROJECTS DRAWER */
  .projects-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; }
  .projects-overlay.open { display: block; }
  .projects-drawer { position: fixed; top: 0; left: 0; width: 340px; height: 100vh; background: var(--bg2); border-left: 1px solid var(--border); z-index: 201; transform: translateX(-100%); transition: transform 0.2s ease; display: flex; flex-direction: column; overscroll-behavior: contain; }
  [dir="ltr"] .projects-drawer { left: auto; right: 0; transform: translateX(100%); }
  .projects-overlay.open .projects-drawer { transform: translateX(0); }
  .drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .drawer-header h2 { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--text2); }
  .drawer-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 20px; padding: 10px; position: relative; }
  .drawer-close:hover { color: var(--text); }
  .drawer-close:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 8px; }
  .drawer-project { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; cursor: pointer; transition: background 0.15s; border: 1px solid transparent; }
  .drawer-project:hover { background: var(--bg3); border-color: var(--border); }
  .drawer-project.active { border-color: rgba(29,158,117,0.3); background: rgba(29,158,117,0.05); }
  .drawer-project-name { font-family: var(--mono); font-size: 13px; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-project-meta { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  .drawer-empty { font-family: var(--sans); font-size: 13px; color: var(--text2); text-align: center; padding: 32px 16px; }
  .drawer-footer { padding: 12px; border-top: 1px solid var(--border); }
  .drawer-project-delete { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 10px; opacity: 0; transition: opacity 0.15s; position: relative; }
  .drawer-project:hover .drawer-project-delete { opacity: 1; }
  .drawer-project-delete:hover { color: #e06060; }
  .drawer-project-dup { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 13px; padding: 10px 6px; opacity: 0; transition: opacity 0.15s; }
  .drawer-project:hover .drawer-project-dup { opacity: 1; }
  .drawer-project-dup:hover { color: var(--text); }
  .drawer-project-subtitle { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta-input { width: 100%; box-sizing: border-box; background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: var(--mono); font-size: 11px; padding: 5px 8px; margin-bottom: 5px; }
  .meta-input:focus { outline: none; border-color: rgba(29,158,117,0.6); }
  .meta-label { font-family: var(--mono); font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; display: block; }

  /* WAVEFORM */
  .waveform-bar { flex-shrink: 0; background: var(--bg2); border-bottom: 1px solid var(--border); position: relative; cursor: crosshair; display: none; user-select: none; }
  .waveform-bar.visible { display: block; }
  .waveform-bar canvas { display: block; width: 100%; height: 72px; pointer-events: none; }
  .waveform-time { position: absolute; top: 4px; right: 10px; font-family: var(--mono); font-size: 10px; color: var(--text3); pointer-events: none; font-variant-numeric: tabular-nums; }

  .w.waveform-flash { background: rgba(29,158,117,0.45) !important; transition: background 0.8s ease-out; border-radius: 2px; }

  /* SEARCH BAR */
  .search-bar { display: none; padding: 0 24px 8px; }

<script src="/static/lang.js"></script>
<script>
let state = {};
let pollingInterval = null;
let progressInterval = null;
let operationStartTime = null;
let assemblyOrder = [];
let currentSelection = null;
let snippetAudio = document.getElementById('audio-player');
let currentLang = localStorage.getItem('fieldcut-lang') || 'en';

// ── i18n ──
function t(key, vars) {
  const str = (LANGS[currentLang] && LANGS[currentLang][key]) || (LANGS.en && LANGS.en[key]) || key;
  if (!vars) return str;
  return str.replace(/\{(\w+)\}/g, (_, k) => vars[k] !== undefined ? vars[k] : '{' + k + '}');
}

function applyLang() {
  const lang = LANGS[currentLang] || LANGS.en;
  const dir = lang._meta.dir;

  // Set document direction and lang
  document.documentElement.setAttribute('dir', dir);
  document.documentElement.setAttribute('lang', currentLang === 'he' ? 'he' : 'en');

  // Update all data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });

  // Update placeholder attributes
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });

  // Update the assembly timeline empty-state text
  const tl = document.getElementById('asm-timeline');
  if (tl) tl.dataset.empty = t('asm_empty');

  // Update the language toggle button
  document.getElementById('lang-toggle').textContent = lang._meta.name;

  localStorage.setItem('fieldcut-lang', currentLang);
}

function cycleLang() {
  const keys = Object.keys(LANGS);
  const idx = keys.indexOf(currentLang);
  currentLang = keys[(idx + 1) % keys.length];
  applyLang();
  // Re-render dynamic content
  renderAll();
  updateProjectName();
}

// ── THEME ──
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('fieldcut-theme', next);
  document.getElementById('theme-toggle').innerHTML = next === 'light' ? '&#9728;' : '&#9790;';
  document.querySelector('meta[name="theme-color"]').content = next === 'light' ? '#f5f5f5' : '#0e0e0e';
}
(function initTheme() {
  const saved = localStorage.getItem('fieldcut-theme');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('theme-toggle').innerHTML = '&#9728;';
    });
  }
})();

// ── PHASE NAVIGATION ──
function setPhase(n) {
  document.querySelectorAll('.phase-screen').forEach(el => {
    el.classList.remove('active');
  });
  const target = document.getElementById('phase-' + n);
  if (target) target.classList.add('active');
  updatePhaseBar(n);
}

function updatePhaseBar(currentPhase) {
  const hasClips = state.clips && state.clips.length > 0;
  document.querySelectorAll('.phase-step').forEach(step => {
    const p = parseInt(step.dataset.phase);
    step.classList.remove('active', 'completed', 'future');
    if (p === currentPhase) {
      step.classList.add('active');
    } else if (p < currentPhase) {
      step.classList.add('completed');
    } else if (p === 2) {
      step.classList.add('completed');
    } else if (p === 3 && hasClips) {
      step.classList.add('completed');
    } else {
      step.classList.add('future');
    }
  });
}

function goToPhase(n) {
  if (n === 3 && !(state.clips && state.clips.length)) {
    return;
  }
  fetch('/set_phase', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phase: n })
  });
  setPhase(n);
}

function renderPhaseButtons() {
  const p1done = document.getElementById('phase1-done-actions');
  if (p1done) p1done.style.display = (state.clips && state.clips.length) ? 'block' : 'none';

  const p2done = document.getElementById('phase2-done-actions');
  if (p2done) p2done.style.display = (state.narration && state.narration.length) ? 'block' : 'none';

  const assembled = state.status === 'assembled';
  const p3pre = document.getElementById('asm-pre-actions');
  if (p3pre) p3pre.style.display = assembled ? 'none' : 'flex';
  const p3done = document.getElementById('phase3-done-actions');
  if (p3done) p3done.style.display = assembled ? 'flex' : 'none';
}

// ── INIT ──
async function init() {
  applyLang();
  const res = await fetch('/state');
  state = await res.json();
  setPhase(state.phase || 1);
  updateProjectName();
  if (state.filename) document.getElementById('file-info').textContent = state.filename;
  renderAll();
  lastStateJson = JSON.stringify(state);
  startAutoSave();
}

function renderAll() {
  renderTranscript();
  renderNarrationPane();
  renderClipsList();
  renderNarrClipsList();
  renderAssemblyPane();
  renderPhaseButtons();
  updatePhaseBar(state.phase || 1);
  if (state.source_file && state.transcript && state.transcript.length) {
    loadWaveform(state.source_file);
  }
  // Restore narration upload state
  if (state.narration_filename && !(state.narration_words && state.narration_words.length)) {
    document.getElementById('narr-file-info').style.display = '';
    document.getElementById('narr-file-info').textContent = '\ud83d\udcce ' + state.narration_filename;
    document.getElementById('transcribe-narr-btn').style.display = '';
    document.getElementById('narr-upload-btn').textContent = t('replace_narration');
  }
}

// ── TRANSCRIBE ──
async function uploadAndTranscribe(event) {
  const file = event.target.files[0];
  if (!file) return;
  document.getElementById('upload-zone').style.display = 'none';
  document.getElementById('file-info').textContent = file.name;
  setStatus('working', t('transcribing'));
  const whisperLang = document.getElementById('whisper-lang').value;
  const formData = new FormData();
  formData.append('file', file);
  formData.append('language', whisperLang);
  const res = await fetch('/transcribe', { method: 'POST', body: formData });
  if (!res.ok) {
    const data = await res.json().catch(() => ({ error: t('server_error') }));
    setStatus('error', data.error || t('transcription_failed'));
    document.getElementById('upload-zone').style.display = '';
    return;
  }
  startProgressPolling();
  startPolling();
}

function startPolling() {
  if (pollingInterval) return;
  pollingInterval = setInterval(async () => {
    const res = await fetch('/status');
    const s = await res.json();
    if (s.status === 'transcribed') {
      clearInterval(pollingInterval); pollingInterval = null;
      stopProgressPolling();
      setStatus('done', t('transcribed', { count: s.segment_count }));
      const r = await fetch('/state'); state = await r.json();
      renderAll();
    } else if (s.status && s.status.startsWith('error')) {
      clearInterval(pollingInterval); pollingInterval = null;
      stopProgressPolling();
      setStatus('error', s.status);
    }
  }, 2000);
}

// ── RENDER WORD-LEVEL TRANSCRIPT ──
function renderTranscript() {
  const container = document.getElementById('transcript-body');
  container.innerHTML = '';
  const segments = state.transcript || [];
  const words = state.words || [];
  if (segments.length === 0) return;
  document.getElementById('upload-zone').style.display = 'none';

  if (words.length === 0) {
    container.innerHTML = segments.map(seg =>
      `<div class="paragraph"><span class="para-ts" onclick="playSnippet('${state.source_file}',${seg.start},${seg.end})">${formatTime(seg.start)}</span> ${seg.text}</div>`
    ).join('');
    return;
  }

  const clips = state.text_clips || [];
  segments.forEach(seg => {
    const para = document.createElement('div');
    para.className = 'paragraph';

    const tsBtn = document.createElement('span');
    tsBtn.className = 'para-ts';
    tsBtn.textContent = formatTime(seg.start);
    tsBtn.onclick = () => playSnippet(state.source_file, seg.start, seg.end);
    para.appendChild(tsBtn);
    para.appendChild(document.createTextNode(' '));

    const segWords = words.filter(w => w.start >= seg.start - 0.05 && w.end <= seg.end + 0.05);

    segWords.forEach(w => {
      let clipInfo = null;
      for (const c of clips) {
        if (w.start >= c.start - 0.01 && w.end <= c.end + 0.01) {
          clipInfo = c;
          break;
        }
      }

      if (clipInfo) {
        const prevWord = words[words.indexOf(w) - 1];
        const isClipStart = !prevWord || prevWord.end < clipInfo.start - 0.01 || prevWord.start < clipInfo.start - 0.01;
        if (isClipStart) {
          const label = document.createElement('span');
          label.className = 'clip-label';
          label.textContent = clipInfo.id;
          para.appendChild(label);
        }
      }

      const span = document.createElement('span');
      span.className = 'w' + (clipInfo ? ' clip-highlight' : '');
      span.dataset.s = w.start;
      span.dataset.e = w.end;
      span.dataset.src = 'interview';
      span.textContent = w.word;
      para.appendChild(span);
      para.appendChild(document.createTextNode(' '));
    });

    container.appendChild(para);
  });
  buildWordSpanIndex();
}

// ── RENDER NARRATION WORD-LEVEL ──
function renderNarrationPane() {
  const pane = document.getElementById('narration-pane');
  const container = document.getElementById('narration-body');
  const countEl = document.getElementById('narr-count');
  const segments = state.narration_transcript || [];
  const words = state.narration_words || [];

  if (segments.length === 0) {
    container.innerHTML = '<span class="hint">' + t('narration_empty') + '</span>';
    return;
  }
  const clipCount = (state.narr_text_clips || []).length;
  countEl.textContent = '\u00b7 ' + segments.length + ' ' + t('passages') + (clipCount ? ' \u00b7 ' + clipCount + ' ' + t('clips_word') : '');

  if (words.length === 0) {
    container.innerHTML = segments.map(seg =>
      `<div class="paragraph"><span class="para-ts" onclick="playSnippet('${state.narration_source}',${seg.start},${seg.end})">${formatTime(seg.start)}</span> ${seg.text}</div>`
    ).join('');
    return;
  }

  const clips = state.narr_text_clips || [];
  container.innerHTML = '';

  segments.forEach(seg => {
    const para = document.createElement('div');
    para.className = 'paragraph';

    const tsBtn = document.createElement('span');
    tsBtn.className = 'para-ts';
    tsBtn.textContent = formatTime(seg.start);
    tsBtn.onclick = () => playSnippet(state.narration_source, seg.start, seg.end);
    para.appendChild(tsBtn);
    para.appendChild(document.createTextNode(' '));

    const segWords = words.filter(w => w.start >= seg.start - 0.05 && w.end <= seg.end + 0.05);

    segWords.forEach(w => {
      let clipInfo = null;
      for (const c of clips) {
        if (w.start >= c.start - 0.01 && w.end <= c.end + 0.01) {
          clipInfo = c; break;
        }
      }

      if (clipInfo) {
        const prevWord = words[words.indexOf(w) - 1];
        const isClipStart = !prevWord || prevWord.end < clipInfo.start - 0.01 || prevWord.start < clipInfo.start - 0.01;
        if (isClipStart) {
          const label = document.createElement('span');
          label.className = 'narr-label';
          label.textContent = clipInfo.id;
          para.appendChild(label);
        }
      }

      const span = document.createElement('span');
      span.className = 'w' + (clipInfo ? ' narr-highlight' : '');
      span.dataset.s = w.start;
      span.dataset.e = w.end;
      span.dataset.src = 'narration';
      span.textContent = w.word;
      para.appendChild(span);
      para.appendChild(document.createTextNode(' '));
    });

    container.appendChild(para);
  });

  document.getElementById('cut-narr-btn').style.display = clipCount > 0 ? '' : 'none';
}

// ── TEXT SELECTION → FLOATING TOOLBAR ──
document.addEventListener('mouseup', (e) => {
  const toolbar = document.getElementById('sel-toolbar');
  const sel = window.getSelection();

  if (!sel || sel.isCollapsed || sel.rangeCount === 0) {
    setTimeout(() => { if (!toolbar.matches(':hover')) toolbar.classList.remove('visible'); }, 200);
    return;
  }

  const range = sel.getRangeAt(0);
  const wordSpans = [];
  const container = range.commonAncestorContainer.nodeType === 1
    ? range.commonAncestorContainer
    : range.commonAncestorContainer.parentElement;

  const allWords = container.closest('.transcript-pane, .narration-pane')?.querySelectorAll('.w') || [];
  allWords.forEach(span => {
    if (sel.containsNode(span, true) && span.dataset.s) {
      wordSpans.push(span);
    }
  });

  if (wordSpans.length === 0) {
    toolbar.classList.remove('visible');
    return;
  }

  const firstWord = wordSpans[0];
  const lastWord = wordSpans[wordSpans.length - 1];
  const startTime = parseFloat(firstWord.dataset.s);
  const endTime = parseFloat(lastWord.dataset.e);
  const source = firstWord.dataset.src;
  const text = wordSpans.map(s => s.textContent).join(' ');

  currentSelection = { start: startTime, end: endTime, text, source };

  const rect = range.getBoundingClientRect();
  toolbar.style.top = (rect.top - 40 + window.scrollY) + 'px';
  toolbar.style.left = (rect.left + rect.width / 2 - 80) + 'px';
  toolbar.classList.add('visible');
});

document.addEventListener('mousedown', (e) => {
  const toolbar = document.getElementById('sel-toolbar');
  if (!toolbar.contains(e.target)) {
    toolbar.classList.remove('visible');
  }
});

// ── PLAY SELECTION / SNIPPET ──
function playSnippet(file, start, end) {
  if (!file) return;
  snippetAudio.src = `/audio_snippet?file=${encodeURIComponent(file)}&start=${start}&end=${end}`;
  snippetAudio.play().catch(() => {});
  if (waveformData && (file === state.source_file || file === waveformSourceFile)) {
    waveformPlayStart = start;
    startPlayheadAnimation();
  }
}

function playSelection() {
  if (!currentSelection) return;
  const file = currentSelection.source === 'narration' ? state.narration_source : state.source_file;
  const btn = document.querySelector('.sel-btn.sel-play');
  if (snippetAudio.paused || snippetAudio.ended) {
    playSnippet(file, currentSelection.start, currentSelection.end);
    btn.textContent = '\u25a0 stop';
    btn.classList.add('sel-playing');
    snippetAudio.onended = () => { btn.textContent = t('play'); btn.classList.remove('sel-playing'); };
  } else {
    snippetAudio.pause();
    btn.textContent = t('play');
    btn.classList.remove('sel-playing');
  }
}

async function markSelection() {
  if (!currentSelection) return;
  const toolbar = document.getElementById('sel-toolbar');
  toolbar.classList.remove('visible');
  window.getSelection().removeAllRanges();

  const sel = { ...currentSelection };
  const addRes = await fetch('/add_clip', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(sel)
  });
  const addData = await addRes.json();
  pushUndo({ type: 'add', clipId: addData.clip_id, start: sel.start, end: sel.end, text: sel.text, source: sel.source });

  const res = await fetch('/state');
  state = await res.json();
  renderTranscript();
  renderNarrationPane();
  renderClipsList();
  renderNarrClipsList();
  renderAssemblyPane();
  renderPhaseButtons();
  updatePhaseBar(state.phase || 1);
  currentSelection = null;
}

    return `<div class="clip-item" id="clip-item-${c.id}" data-start="${c.start}" data-end="${c.end}" data-source="${src}" onmouseenter="startClipPreview(this)" onmouseleave="stopClipPreview()" style="flex-wrap:wrap">

// ── WAVEFORM ──
let waveformData = null;
let waveformDuration = 0;
let waveformSourceFile = null;
let waveformPlayhead = 0;
let waveformPlayStart = 0;
let playheadAnimFrame = null;
let silenceRegions = [];
let wordSpanIndex = [];
let waveformZoom = 1;
let waveformOffset = 0; // left-edge time of visible window (seconds)
let lastHoverWordSpan = null;

async function loadWaveform(sourceFile) {
  if (!sourceFile) return;
  if (waveformSourceFile === sourceFile && waveformData) { drawWaveform(); return; }
  const res = await fetch(`/waveform?file=${encodeURIComponent(sourceFile)}`);
  if (!res.ok) return;
  const data = await res.json();
  if (data.error || !data.points) return;
  waveformData = data.points;
  waveformDuration = data.duration;
  waveformSourceFile = sourceFile;
  waveformZoom = 1;
  waveformOffset = 0;
  computeSilences();
  document.getElementById('waveform-bar').classList.add('visible');
  drawWaveform();
}

function computeSilences() {
  silenceRegions = [];
  if (!waveformData || !waveformDuration) return;
  const threshold = 0.06;
  const secPerPt = waveformDuration / waveformData.length;
  const minPts = Math.ceil(1.5 / secPerPt);
  let silStart = null, silLen = 0;
  waveformData.forEach((v, i) => {
    if (v < threshold) {
      if (silStart === null) silStart = i;
      silLen++;
    } else {
      if (silStart !== null && silLen >= minPts)
        silenceRegions.push({ start: silStart * secPerPt, end: (silStart + silLen) * secPerPt });
      silStart = null; silLen = 0;
    }
  });
  if (silStart !== null && silLen >= minPts)
    silenceRegions.push({ start: silStart * secPerPt, end: waveformDuration });
}

function buildWordSpanIndex() {
  wordSpanIndex = [];
  document.querySelectorAll('#transcript-body .w[data-s]').forEach(span => {
    wordSpanIndex.push({ start: parseFloat(span.dataset.s), end: parseFloat(span.dataset.e), span });
  });
}

function findWordSpanAtTime(t) {
  let best = null, bestDist = Infinity;
  for (const entry of wordSpanIndex) {
    if (t >= entry.start && t <= entry.end) return entry.span;
    const dist = Math.min(Math.abs(t - entry.start), Math.abs(t - entry.end));
    if (dist < bestDist) { bestDist = dist; best = entry; }
  }
  return best ? best.span : null;
}

function scrollTranscriptToTime(t) {
  const span = findWordSpanAtTime(t);
  if (!span) return;
  span.scrollIntoView({ behavior: 'smooth', block: 'center' });
  span.classList.remove('waveform-flash');
  void span.offsetWidth; // reflow to restart transition
  span.classList.add('waveform-flash');
  setTimeout(() => span.classList.remove('waveform-flash'), 900);
}

function waveformVisWindow() {
  const visDur = waveformDuration / waveformZoom;
  const start = Math.max(0, Math.min(waveformDuration - visDur, waveformOffset));
  return { start, end: start + visDur, dur: visDur };
}
function tToX(t, W) {
  const { start, dur } = waveformVisWindow();
  return ((t - start) / dur) * W;
}
function xToT(x, W) {
  const { start, dur } = waveformVisWindow();
  return start + (x / W) * dur;
}

function drawWaveform() {
  const canvas = document.getElementById('waveform-canvas');
  if (!canvas || !waveformData) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth;
  const H = 72;
  const SB = 4; // scrollbar strip height at bottom
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const cs = getComputedStyle(document.documentElement);
  const textColor = cs.getPropertyValue('--text').trim();
  const bg2 = cs.getPropertyValue('--bg2').trim();
  const text3 = cs.getPropertyValue('--text3').trim() || '#888';
  ctx.fillStyle = bg2;
  ctx.fillRect(0, 0, W, H);

  const { start: visStart, end: visEnd, dur: visDur } = waveformVisWindow();

  // Clip regions + number badges
  (state.text_clips || []).forEach(c => {
    if (c.end < visStart || c.start > visEnd) return;
    const x1 = tToX(c.start, W);
    const x2 = tToX(c.end, W);
    const rw = x2 - x1;
    ctx.fillStyle = 'rgba(29,158,117,0.18)';
    ctx.fillRect(x1, 0, rw, H - SB);
    ctx.strokeStyle = 'rgba(29,158,117,0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x1, 0); ctx.lineTo(x1, H - SB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, 0); ctx.lineTo(x2, H - SB); ctx.stroke();

    // Badge — centered in the visible slice of the clip
    const label = String(parseInt(c.id.replace('clip_', ''), 10));
    ctx.font = `bold 13px monospace`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    const visX1 = Math.max(0, x1);
    const visX2 = Math.min(W, x2);
    if (visX2 - visX1 < 6) { ctx.textAlign = 'left'; return; }
    const cx = (visX1 + visX2) / 2;
    const cy = (H - SB) / 2;
    const tw = ctx.measureText(label).width;
    const bw2 = tw + 12, bh2 = 20;
    ctx.fillStyle = 'rgba(22,120,90,0.92)';
    ctx.beginPath(); ctx.roundRect(cx - bw2 / 2, cy - bh2 / 2, bw2, bh2, 5); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(label, cx, cy);
    ctx.textAlign = 'left';
  });

  // Waveform bars — only render visible range for performance
  const pts = waveformData;
  const startPt = Math.max(0, Math.floor(visStart / waveformDuration * pts.length) - 1);
  const endPt = Math.min(pts.length, Math.ceil(visEnd / waveformDuration * pts.length) + 1);
  const bw = W / ((endPt - startPt) || 1) * ((endPt - startPt) / pts.length * waveformZoom);
  const cy = (H - SB) / 2;
  ctx.fillStyle = text3;
  for (let i = startPt; i < endPt; i++) {
    const t = (i / pts.length) * waveformDuration;
    const x = tToX(t, W);
    const bh = Math.max(1, pts[i] * (H - SB) * 0.88);
    ctx.fillRect(x, cy - bh / 2, Math.max(0.8, bw - 0.5), bh);
  }

  // Playhead
  if (waveformPlayhead >= visStart && waveformPlayhead <= visEnd) {
    const px = tToX(waveformPlayhead, W);
    ctx.strokeStyle = textColor;
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H - SB); ctx.stroke();
    ctx.fillStyle = textColor;
    ctx.beginPath(); ctx.moveTo(px - 4, 0); ctx.lineTo(px + 4, 0); ctx.lineTo(px, 7); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Scrollbar (only when zoomed in)
  if (waveformZoom > 1) {
    ctx.fillStyle = cs.getPropertyValue('--border').trim() || '#333';
    ctx.fillRect(0, H - SB, W, SB);
    const thumbW = W / waveformZoom;
    const thumbX = (visStart / waveformDuration) * W;
    ctx.fillStyle = text3;
    ctx.beginPath(); ctx.roundRect(thumbX, H - SB + 1, Math.max(20, thumbW), SB - 2, 2); ctx.fill();
  }
}

function startPlayheadAnimation() {
  if (playheadAnimFrame) cancelAnimationFrame(playheadAnimFrame);
  function tick() {
    waveformPlayhead = waveformPlayStart + snippetAudio.currentTime;
    drawWaveform();
    if (!snippetAudio.ended) {
      playheadAnimFrame = requestAnimationFrame(tick);
    } else {
      playheadAnimFrame = null;
    }
  }
  // Wait for play event in case audio hasn't started yet
  if (!snippetAudio.paused) {
    tick();
  } else {
    snippetAudio.addEventListener('play', tick, { once: true });
  }
}

function waveformMouseDown(e) {
  if (!waveformDuration || !state.source_file) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const t = xToT(e.clientX - rect.left, rect.width);
  waveformPlayhead = t;
  drawWaveform();
  playSnippet(state.source_file, t, Math.min(waveformDuration, t + 30));
  scrollTranscriptToTime(t);
}

function waveformMouseMove(e) {
  if (!waveformDuration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const t = xToT(e.clientX - rect.left, rect.width);
  document.getElementById('waveform-time').textContent = formatTime(t);
  if (wordSpanIndex.length) {
    if (lastHoverWordSpan) lastHoverWordSpan.classList.remove('waveform-hover');
    const span = findWordSpanAtTime(t);
    if (span) { span.classList.add('waveform-hover'); lastHoverWordSpan = span; }
    else lastHoverWordSpan = null;
  }
}

function waveformHoverEnd() {
  document.getElementById('waveform-time').textContent = '';
  if (lastHoverWordSpan) { lastHoverWordSpan.classList.remove('waveform-hover'); lastHoverWordSpan = null; }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('waveform-bar').addEventListener('wheel', e => {
    e.preventDefault();
    if (!waveformData) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const absX = Math.abs(e.deltaX), absY = Math.abs(e.deltaY);

    if (absX > absY) {
      // Horizontal scroll → pan
      if (waveformZoom <= 1) return;
      const visDur = waveformDuration / waveformZoom;
      waveformOffset += (e.deltaX / rect.width) * visDur;
      waveformOffset = Math.max(0, Math.min(waveformDuration - visDur, waveformOffset));
    } else {
      // Vertical scroll → zoom (smooth, proportional to gesture speed)
      const mouseRatio = (e.clientX - rect.left) / rect.width;
      const mouseT = xToT(e.clientX - rect.left, rect.width);
      const factor = Math.exp(-e.deltaY * 0.003);
      waveformZoom = Math.max(1, Math.min(100, waveformZoom * factor));
      const newVisDur = waveformDuration / waveformZoom;
      waveformOffset = mouseT - mouseRatio * newVisDur;
      waveformOffset = Math.max(0, Math.min(waveformDuration - newVisDur, waveformOffset));
    }
    drawWaveform();
  }, { passive: false });
});

function toggleTrim(id, source) {
  stopClipPreview();
  const el = document.getElementById('clip-item-' + id);
  if (el) el.classList.toggle('trimming');
}

async function adjustTrim(id, source, field, delta) {
  stopClipPreview();
  const valEl = document.getElementById(`trim-${field}-${id}`);
  if (!valEl) return;
  const current = parseFloat(valEl.textContent);
  const newVal = Math.round((current + delta) * 10) / 10;
  if (newVal < 0) return;
  valEl.textContent = newVal.toFixed(1) + 's';

  // Update dataset on parent for hover preview
  const item = document.getElementById('clip-item-' + id);
  if (item) item.dataset[field] = newVal;

  await fetch('/trim_clip', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, source, [field]: newVal })
  });

  // Refresh state to keep clip list in sync
  const s = await fetch('/state').then(r => r.json());
  const clips = source === 'narration' ? (s.narr_text_clips || []) : (s.text_clips || []);
  const c = clips.find(c => c.id === id);
  if (c) {
    const startEl = document.getElementById('trim-start-' + id);
    const endEl = document.getElementById('trim-end-' + id);
    if (startEl) startEl.textContent = c.start.toFixed(1) + 's';
    if (endEl) endEl.textContent = c.end.toFixed(1) + 's';
    const durEl = item && item.querySelector('.clip-dur');
    if (durEl) durEl.textContent = formatDur(c.end - c.start);
  }
}

let previewTimer = null;
let previewAudio = null;

function startClipPreview(el) {
  const start = parseFloat(el.dataset.start);
  const end = parseFloat(el.dataset.end);
  const src = el.dataset.source;
  if (!src || isNaN(start) || isNaN(end)) return;
  previewTimer = setTimeout(() => {
    stopClipPreview();
    const previewEnd = Math.min(end, start + 3);
    const url = `/audio_snippet?file=${encodeURIComponent(src)}&start=${start}&end=${previewEnd}`;
    previewAudio = new Audio(url);
    previewAudio.play().catch(() => {});
  }, 500);
}

function stopClipPreview() {
  clearTimeout(previewTimer);
  previewTimer = null;
  if (previewAudio) {
    previewAudio.pause();
    previewAudio.src = '';
    previewAudio = null;
  }
}

async function removeClip(id, source) {
  // Find clip data for undo before removing
  const clipList = source === 'narration' ? (state.narr_text_clips || []) : (state.text_clips || []);
  const clip = clipList.find(c => c.id === id);
  if (clip) pushUndo({ type: 'remove', clipId: id, start: clip.start, end: clip.end, text: clip.text, source: source });

  await fetch('/remove_clip', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, source })
  });
  const res = await fetch('/state');
  state = await res.json();
  renderTranscript();
  renderNarrationPane();
  renderClipsList();
  renderNarrClipsList();
  renderAssemblyPane();
}

// ── CUT CLIPS ──
async function cutClips() {
  setStatus('working', t('cutting_clips'));
  const res = await fetch('/cut_clips', { method: 'POST' });
  const data = await res.json();
  if (data.error) { setStatus('error', data.error); return; }
  startProgressPolling();
  pollUntilStatus('clips_ready', () => {
    stopProgressPolling();
    setStatus('done', t('clips_cut'));
    fetch('/state').then(r => r.json()).then(s => { state = s; renderClipsList(); renderAssemblyPane(); renderPhaseButtons(); updatePhaseBar(state.phase || 1); });
  });
}

// ── NARRATION ──
async function importScript(event) {
  const file = event.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  setStatus('working', t('importing_script'));
  const res = await fetch('/import_script', { method: 'POST', body: formData });
  const data = await res.json();
  if (data.error) { setStatus('error', data.error); return; }
  document.getElementById('script-text').value = data.text;
  setStatus('done', t('script_imported'));
}

async function uploadNarrationAudio(event) {
  const file = event.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  setStatus('working', t('uploading_narration'));
  const res = await fetch('/upload_narration_audio', { method: 'POST', body: formData });
  const data = await res.json();
  if (data.error) { setStatus('error', data.error); return; }
  document.getElementById('narr-file-info').style.display = '';
  document.getElementById('narr-file-info').textContent = '\ud83d\udcce ' + data.filename;
  document.getElementById('transcribe-narr-btn').style.display = '';
  document.getElementById('narr-upload-btn').textContent = t('replace_narration');
  setStatus('done', t('narration_uploaded'));
}

async function transcribeNarration() {
  const script = document.getElementById('script-text').value.trim();
  setStatus('working', t('transcribing_narration'));
  await fetch('/process_narration', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ script })
  });
  startProgressPolling();
  pollUntilStatus('narration_ready', () => {
    stopProgressPolling();
    setStatus('done', t('narration_transcribed'));
    document.getElementById('transcribe-narr-btn').style.display = 'none';
    fetch('/state').then(r => r.json()).then(s => {
      state = s;
      renderNarrationPane();
      renderNarrClipsList();
      renderPhaseButtons();
      updatePhaseBar(state.phase || 1);
    });
  });
}

async function cutNarration() {
  setStatus('working', t('cutting_narration'));
  const res = await fetch('/cut_narration', { method: 'POST' });
  const data = await res.json();
  if (data.error) { setStatus('error', data.error); return; }
  startProgressPolling();
  pollUntilStatus('narration_cut', () => {
    stopProgressPolling();
    setStatus('done', t('narration_cut'));
    fetch('/state').then(r => r.json()).then(s => {
      state = s;
      renderNarrClipsList();
      renderAssemblyPane();
      renderPhaseButtons();
      updatePhaseBar(state.phase || 1);
    });

// ── ASSEMBLY (drag and drop) ──
function renderAssemblyPane() {
  const clips = state.clips || [];
  const narr = state.narration || [];

  const clipsSrc = document.getElementById('asm-clips-source');
  const narrSrc = document.getElementById('asm-narr-source');
  if (!clipsSrc || !narrSrc) return;

  clipsSrc.innerHTML = clips.map(c =>
    `<div class="asm-chip chip-clip" draggable="true" data-type="clip" data-id="${c.id}">${c.id}</div>`
  ).join('') || '<span style="font-size:10px;color:var(--text3)">' + t('asm_no_clips') + '</span>';

  narrSrc.innerHTML = narr.map(n =>
    `<div class="asm-chip chip-narr" draggable="true" data-type="narration" data-file="${n.name}">${n.name.replace('.wav','')}</div>`
  ).join('') || '<span style="font-size:10px;color:var(--text3)">' + t('asm_no_narration') + '</span>';

  // Set the empty-state text for CSS
  const tl = document.getElementById('asm-timeline');
  if (tl) tl.dataset.empty = t('asm_empty');

  renderTimeline();
  initDragAndDrop();
}

function renderTimeline() {
  const tl = document.getElementById('asm-timeline');
  tl.innerHTML = assemblyOrder.map((item, i) => {
    const label = item.type === 'narration' ? (item.file || '').replace('.wav','') : item.id;
    const cls = item.type === 'narration' ? 'tl-narr' : 'tl-clip';
    return `<div class="asm-tl-item ${cls}" draggable="true" data-index="${i}">
      ${label} <span class="asm-x" onclick="event.stopPropagation();removeFromAssembly(${i})">\u00d7</span>
    </div>`;
  }).join('');

  const usedClips = new Set(assemblyOrder.filter(a => a.type === 'clip').map(a => a.id));
  const usedNarr = new Set(assemblyOrder.filter(a => a.type === 'narration').map(a => a.file));
  document.querySelectorAll('.asm-chip').forEach(chip => {
    const isUsed = (chip.dataset.type === 'clip' && usedClips.has(chip.dataset.id))
                || (chip.dataset.type === 'narration' && usedNarr.has(chip.dataset.file));
    chip.classList.toggle('used', isUsed);
  });

  initDragAndDrop();
}

function initDragAndDrop() {
  document.querySelectorAll('.asm-chip[draggable]').forEach(chip => {
    chip.ondragstart = e => {
      e.dataTransfer.setData('text/plain', JSON.stringify({ source: 'chip', type: chip.dataset.type, id: chip.dataset.id || null, file: chip.dataset.file || null }));
      chip.classList.add('dragging');
    };
    chip.ondragend = () => chip.classList.remove('dragging');
  });

  document.querySelectorAll('.asm-tl-item[draggable]').forEach(item => {
    item.ondragstart = e => {
      e.dataTransfer.setData('text/plain', JSON.stringify({ source: 'timeline', index: parseInt(item.dataset.index) }));
      item.classList.add('dragging');
    };
    item.ondragend = () => item.classList.remove('dragging');
    item.ondragover = e => {
      e.preventDefault();
      const rect = item.getBoundingClientRect();
      const mid = rect.left + rect.width / 2;
      item.classList.remove('drag-over-left', 'drag-over-right');
      item.classList.add(e.clientX < mid ? 'drag-over-right' : 'drag-over-left');
    };
    item.ondragleave = () => item.classList.remove('drag-over-left', 'drag-over-right');
    item.ondrop = e => {
      e.preventDefault();
      item.classList.remove('drag-over-left', 'drag-over-right');
      const data = JSON.parse(e.dataTransfer.getData('text/plain'));
      const targetIdx = parseInt(item.dataset.index);
      const rect = item.getBoundingClientRect();
      const insertIdx = e.clientX >= rect.left + rect.width / 2 ? targetIdx + 1 : targetIdx;
      if (data.source === 'timeline') {
        const [moved] = assemblyOrder.splice(data.index, 1);
        assemblyOrder.splice(data.index < insertIdx ? insertIdx - 1 : insertIdx, 0, moved);
      } else {
        assemblyOrder.splice(insertIdx, 0, data.type === 'narration' ? { type: 'narration', file: data.file } : { type: 'clip', id: data.id });
      }
      renderTimeline();
    };
  });

  const tl = document.getElementById('asm-timeline');
  tl.ondragover = e => { e.preventDefault(); tl.classList.add('drag-over'); };
  tl.ondragleave = e => { if (e.target === tl) tl.classList.remove('drag-over'); };
  tl.ondrop = e => {
    e.preventDefault(); tl.classList.remove('drag-over');
    if (e.target !== tl && !e.target.classList.contains('asm-timeline')) return;
    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
    if (data.source === 'timeline') { const [m] = assemblyOrder.splice(data.index, 1); assemblyOrder.push(m); }
    else { assemblyOrder.push(data.type === 'narration' ? { type: 'narration', file: data.file } : { type: 'clip', id: data.id }); }
    renderTimeline();
  };
}

function removeFromAssembly(i) { assemblyOrder.splice(i, 1); renderTimeline(); }
function clearAssembly() { assemblyOrder = []; renderTimeline(); }
function reassemble() { state.status = 'clips_ready'; renderPhaseButtons(); }

let assemblyGap = 1.0;
function adjustGap(delta) {
  assemblyGap = Math.round(Math.max(0, Math.min(5, assemblyGap + delta)) * 10) / 10;
  document.getElementById('gap-display').textContent = assemblyGap.toFixed(1) + 's';
}

async function assembleRoughCut() {
  if (assemblyOrder.length === 0) { alert(t('drag_first')); return; }
  setStatus('working', t('assembling'));
  const res = await fetch('/assemble', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order: assemblyOrder, output_name: 'rough_cut.wav', gap: assemblyGap })
  });
  const data = await res.json();
  if (data.error) { setStatus('error', data.error); return; }
  startProgressPolling();
  pollUntilStatus('assembled', async () => {
    stopProgressPolling();
    setStatus('done', t('rough_cut_ready'));
    const res2 = await fetch('/state');
    state = await res2.json();
    renderPhaseButtons();
  });
}

async function exportPaperEdit() {
  if (assemblyOrder.length === 0) { alert(t('drag_first')); return; }
  setStatus('working', t('assembling'));
  const res = await fetch('/export_paper_edit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order: assemblyOrder })
  });
  if (!res.ok) { setStatus('error', t('server_error')); return; }
  const blob = await res.blob();

  const a = document.createElement('a');
  a.href = url; a.download = 'paper_edit.docx'; a.click();

}

// ── PROGRESS BAR ──
function startProgressPolling() {
  operationStartTime = Date.now();
  const bar = document.getElementById('progress-bar');
  const fill = document.getElementById('progress-fill');
  bar.classList.add('active');
  fill.className = 'progress-fill indeterminate';
  fill.style.width = '0%';
  if (progressInterval) clearInterval(progressInterval);
  progressInterval = setInterval(async () => {
    try {
      const res = await fetch('/progress');
      const p = await res.json();
      const msgEl = document.getElementById('progress-msg');
      const elapsedEl = document.getElementById('progress-elapsed');
      const elapsed = Math.floor((Date.now() - operationStartTime) / 1000);
      const min = Math.floor(elapsed / 60), sec = elapsed % 60;
      elapsedEl.textContent = min > 0 ? `${min}m ${sec}s` : `${sec}s`;
      if (p.phase && p.total > 0) {
        fill.className = 'progress-fill';
        fill.style.width = Math.round((p.current / p.total) * 100) + '%';
        msgEl.textContent = p.message;
      } else if (p.phase) {
        fill.className = 'progress-fill indeterminate';
        msgEl.textContent = p.message || t('assembling');
      }
    } catch(e) {}
  }, 500);
}

function stopProgressPolling() {
  if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
  const bar = document.getElementById('progress-bar');
  const fill = document.getElementById('progress-fill');
  fill.className = 'progress-fill'; fill.style.width = '100%';
  setTimeout(() => { bar.classList.remove('active'); fill.style.width = '0%'; }, 1500);
  operationStartTime = null;
}

function pollUntilStatus(target, callback) {
  const iv = setInterval(async () => {
    const res = await fetch('/status');
    const s = await res.json();
    if (s.status === target) { clearInterval(iv); callback(); }
    else if (s.status && s.status.startsWith('error')) { clearInterval(iv); stopProgressPolling(); setStatus('error', s.status); }
  }, 500);
}

// ── HELPERS ──
function setStatus(type, msg) {
  const pill = document.getElementById('status-pill');
  pill.className = 'status-pill status-' + type;
  pill.textContent = msg;
}
function formatTime(secs) {
  const m = Math.floor(secs / 60), s = Math.floor(secs % 60);
  return m + ':' + String(s).padStart(2,'0');
}
function formatDur(secs) {
  const m = Math.floor(secs / 60), s = Math.floor(secs % 60);
  return m > 0 ? m + 'm' + String(s).padStart(2,'0') + 's' : s + 's';
}
// --- Project management ---

function updateProjectName() {
  const el = document.getElementById('project-name');
  const name = state.project_name || t('untitled');
  el.textContent = name;
  el.title = (!state.project_name || state.project_name === t('untitled')) ? t('click_to_name') : t('click_to_rename');
}

function renameProject() {
  const current = state.project_name || '';
  const name = prompt(t('project_name_prompt'), current);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  state.project_name = trimmed;
  updateProjectName();
  fetch('/save_project', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: trimmed })
  });
}

async function saveCurrentProject() {
  let name = state.project_name;
  if (!name || name === t('untitled')) {
    name = prompt(t('name_project_prompt'));
    if (!name || !name.trim()) return;
    name = name.trim();
  }
  const res = await fetch('/save_project', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  state.project_name = data.name;
  updateProjectName();
  loadProjectList();
}

async function saveProject() { return saveCurrentProject(); }

async function newProject() {
  const hasWork = state.transcript && state.transcript.length > 0;
  if (hasWork) {
    const choice = confirm(t('save_before_new'));
    if (choice) {
      await saveCurrentProject();
    } else {
      if (!confirm(t('unsaved_warning'))) return;
    }
  }
  await fetch('/reset', { method: 'POST' });
  window.location.reload();
}

// --- Projects drawer ---

function toggleProjectsDrawer() {
  const overlay = document.getElementById('projects-overlay');
  overlay.classList.toggle('open');
  if (overlay.classList.contains('open')) { loadProjectList(); updateMetaPanel(); }
}

function closeProjectsDrawer(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('projects-overlay').classList.remove('open');
}

async function loadProjectList() {
  const res = await fetch('/projects');
  const data = await res.json();
  const body = document.getElementById('drawer-body');
  if (!body) return;

  if (data.projects.length === 0) {
    body.innerHTML = '<div class="drawer-empty">' + t('no_projects') + '</div>';
    return;
  }

  const currentName = state.project_name || '';
  body.innerHTML = data.projects.map(function(p) {
    const name = p.name;
    const isActive = name === currentName;
    const escaped = name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    const subtitle = [p.interviewee, p.recording_date].filter(Boolean).join(' · ');
    return '<div class="drawer-project' + (isActive ? ' active' : '') + '">'
      + '<div style="flex:1;min-width:0;cursor:pointer" onclick="loadProject(\'' + escaped + '\')">'
      + '<div class="drawer-project-name">' + name + (isActive ? ' <span class="drawer-project-meta">' + t('current') + '</span>' : '') + '</div>'
      + (subtitle ? '<div class="drawer-project-subtitle">' + subtitle + '</div>' : '')
      + '</div>'
      + '<button class="drawer-project-dup" onclick="event.stopPropagation();duplicateProject(\'' + escaped + '\')" title="Duplicate">⧉</button>'
      + '<button class="drawer-project-delete" onclick="event.stopPropagation();deleteProject(\'' + escaped + '\')" title="Delete">&times;</button>'
      + '</div>';
  }).join('');

  updateMetaPanel();
}

function updateMetaPanel() {
  const panel = document.getElementById('drawer-meta');
  if (!panel) return;
  const hasProject = !!state.project_name;
  panel.style.display = hasProject ? 'block' : 'none';
  if (hasProject) {
    document.getElementById('meta-interviewee').value = state.interviewee || '';
    document.getElementById('meta-date').value = state.recording_date || '';
    document.getElementById('meta-notes').value = state.notes || '';
  }
}

async function saveMetadata() {
  const interviewee = document.getElementById('meta-interviewee')?.value || '';
  const recording_date = document.getElementById('meta-date')?.value || '';
  const notes = document.getElementById('meta-notes')?.value || '';
  await fetch('/update_metadata', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ interviewee, recording_date, notes })
  });
  state.interviewee = interviewee;
  state.recording_date = recording_date;
  state.notes = notes;
}

async function duplicateProject(name) {
  const res = await fetch('/duplicate_project', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  window.location.reload();
}

async function loadProject(name) {
  if (!confirm(t('load_confirm', { name: name }))) return;
  const res = await fetch('/load_project', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }

}

async function deleteProject(name) {
  if (!confirm(t('delete_confirm', { name: name }))) return;
  const res = await fetch('/delete_project', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  // If we deleted the current project, clear the name
  if (state.project_name === name) {
    state.project_name = null;
    updateProjectName();
  }
  loadProjectList();
}

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown', (e) => {
  // Ignore when typing in inputs
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
    // Only handle Escape in inputs
    if (e.key === 'Escape') { e.target.blur(); closeSearch(); }
    return;
  }

  // Ctrl/Cmd+S — save project
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveCurrentProject();
    return;
  }

  // Ctrl/Cmd+F — open search
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    openSearch();
    return;
  }

  // Ctrl/Cmd+Z — undo
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z') {
    e.preventDefault();
    undoClip();
    return;
  }

  // Ctrl/Cmd+Shift+Z — redo
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'z') {
    e.preventDefault();
    redoClip();
    return;
  }

  // Space — play/pause
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (!snippetAudio.paused) { snippetAudio.pause(); }
    else if (currentSelection) { playSelection(); }
    return;
  }

  // Escape — deselect, close drawers
  if (e.key === 'Escape') {
    document.getElementById('sel-toolbar').classList.remove('visible');
    closeProjectsDrawer();
    closeSearch();
    window.getSelection().removeAllRanges();
    currentSelection = null;
    return;
  }

  // 1, 2, 3 — jump to phase
  if (e.key === '1') { goToPhase(1); return; }
  if (e.key === '2') { goToPhase(2); return; }
  if (e.key === '3') { goToPhase(3); return; }
});

// ── AUTO-SAVE ──
let autoSaveInterval = null;
let lastStateJson = '';

function startAutoSave() {
  autoSaveInterval = setInterval(() => {
    const current = JSON.stringify(state);
    if (current !== lastStateJson && state.project_name) {
      lastStateJson = current;
      fetch('/save_project', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: state.project_name })
      }).then(() => {
        const dot = document.getElementById('autosave-dot');
        dot.classList.add('visible');
        setTimeout(() => dot.classList.remove('visible'), 1500);
      });
    }
  }, 30000); // Every 30 seconds
}

// ── UNDO/REDO ──
let undoStack = [];
let redoStack = [];

function pushUndo(clipData) {
  undoStack.push(clipData);
  redoStack = []; // Clear redo on new action
  if (undoStack.length > 50) undoStack.shift();
}

async function undoClip() {
  if (undoStack.length === 0) return;
  const action = undoStack.pop();

  if (action.type === 'add') {
    // Undo an add = remove the clip
    await fetch('/remove_clip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: action.clipId, source: action.source })
    });
    redoStack.push(action);
  } else if (action.type === 'remove') {
    // Undo a remove = re-add the clip
    await fetch('/add_clip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start: action.start, end: action.end, text: action.text, source: action.source })
    });
    redoStack.push(action);
  }

  const res = await fetch('/state');
  state = await res.json();
  renderAll();
}

async function redoClip() {
  if (redoStack.length === 0) return;
  const action = redoStack.pop();

  if (action.type === 'add') {
    // Redo an add = add again
    await fetch('/add_clip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start: action.start, end: action.end, text: action.text, source: action.source })
    });
    undoStack.push(action);
  } else if (action.type === 'remove') {
    // Redo a remove = remove again
    await fetch('/remove_clip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: action.clipId, source: action.source })
    });
    undoStack.push(action);
  }

  const res = await fetch('/state');
  state = await res.json();
  renderAll();
}

// ── SEARCH ──
let searchMatches = [];
let searchIndex = -1;

function openSearch() {
  const bar = document.getElementById('search-bar');
  bar.classList.add('active');
  document.getElementById('search-input').focus();
}

function closeSearch() {
  const bar = document.getElementById('search-bar');
  bar.classList.remove('active');
  document.getElementById('search-input').value = '';
  clearSearchHighlights();
  searchMatches = [];
  searchIndex = -1;
  document.getElementById('search-nav').textContent = '';
}

function doSearch() {
  clearSearchHighlights();
  const query = document.getElementById('search-input').value.trim().toLowerCase();
  if (!query) { searchMatches = []; searchIndex = -1; document.getElementById('search-nav').textContent = ''; return; }

  searchMatches = [];
  document.querySelectorAll('#transcript-body .w, #narration-body .w').forEach(span => {
    if (span.textContent.toLowerCase().includes(query)) {
      span.classList.add('search-match');
      searchMatches.push(span);
    }
  });

  searchIndex = searchMatches.length > 0 ? 0 : -1;
  updateSearchNav();
  if (searchIndex >= 0) scrollToMatch();
}

function searchNav(dir) {
  if (searchMatches.length === 0) return;
  searchIndex = (searchIndex + dir + searchMatches.length) % searchMatches.length;
  updateSearchNav();
  scrollToMatch();
}

function searchKeydown(e) {
  if (e.key === 'Enter') { searchNav(e.shiftKey ? -1 : 1); e.preventDefault(); }
  if (e.key === 'Escape') { closeSearch(); }
}

function updateSearchNav() {
  const nav = document.getElementById('search-nav');
  if (searchMatches.length === 0) { nav.textContent = '0/0'; return; }
  nav.textContent = (searchIndex + 1) + '/' + searchMatches.length;
  // Update current highlight
  searchMatches.forEach(s => s.classList.remove('search-current'));
  if (searchIndex >= 0) searchMatches[searchIndex].classList.add('search-current');
}

function scrollToMatch() {
  if (searchIndex < 0 || !searchMatches[searchIndex]) return;
  searchMatches[searchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function clearSearchHighlights() {
  document.querySelectorAll('.search-match').forEach(el => el.classList.remove('search-match', 'search-current'));
}

init();

// Redraw waveform on resize
new ResizeObserver(() => { if (waveformData) drawWaveform(); })
  .observe(document.getElementById('waveform-bar'));
